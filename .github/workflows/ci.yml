name: CI

on:
  push:
    branches: [main, master, 'improvement/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Unit and HTTP tests
        run: npm test
      - name: Dependency audit (report only)
        # Findings are shown, but do not fail the build: most come from indirect dependencies that cannot be
        # fixed here. Look at the output when it changes.
        run: npm audit --omit=dev || true

  remote-ui:
    name: Remote UI lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remote_ui/package-lock.json
      - run: npm ci
      - name: Lint (errors fail, warnings are shown)
        run: npm run lint
      - run: npm run build
      - name: Dependency audit (report only)
        run: npm audit --omit=dev || true

  display:
    name: Display analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: display_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
